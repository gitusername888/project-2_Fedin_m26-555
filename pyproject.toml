[project]
name = "primitive-db"
version = "0.1.0"
description = "PrimitiveDB — простая консольная реляционная база данных с SQL-подобным интерфейсом. Данные хранятся в JSON-файлах, метаданные таблиц — в `db_meta.json`."
readme = "README.md"
authors = [
    { name = "Fedin_m26-555", email = "fdu11287@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main" 

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 
